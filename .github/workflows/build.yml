name: Compilar APK Delicias Crisant

on:
  workflow_dispatch:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar APK con Flet Action
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Guardar APK como descarga
        uses: actions/upload-artifact@v4
        with:
          name: Delicias-Crisant-APK
          path: build/apk/*.apk
