name: Compilar APK Delicias Crisant

on:
  workflow_dispatch:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias base de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Instalar Flet y paquetes
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]" reportlab pillow

      - name: Compilar APK
        run: |
          flet build apk -v

      - name: Subir instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: Delicias-Crisant-APK
          path: build/apk/*.apk
