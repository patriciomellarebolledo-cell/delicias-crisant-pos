name: Compilar APK Delicias Crisant

on:
  workflow_dispatch:
  push:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet y herramientas
        run: |
          pip install --upgrade pip
          pip install "flet[all]" reportlab pillow

      - name: Compilar APK con Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Guardar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Delicias-Crisant-APK
          path: build/apk/*.apk
